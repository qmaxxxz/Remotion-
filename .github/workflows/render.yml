
name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion Composition ID"
        required: true
        default: "Video"
        type: string

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Ambil kode dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Siapkan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Periksa struktur proyek
      - name: Diagnose Project
        shell: bash
        run: |
          echo "=== PROJECT LOCATION ==="
          pwd

          echo "=== PROJECT FILES ==="
          find . -maxdepth 4 -type f \
            ! -path './node_modules/*' \
            ! -path './.git/*' | sort | head -200

          echo "=== PACKAGE JSON ==="
          cat package.json

          echo "=== REMOTION ENTRY FILES ==="
          find . -maxdepth 4 -type f \
            \( -name "index.ts" -o -name "index.tsx" \
            -o -name "index.js" -o -name "Root.tsx" \) \
            ! -path './node_modules/*'

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 5. Pastikan Remotion CLI tersedia
            - name: Check Remotion Dependencies
        run: |
          npm ls remotion @remotion/cli @remotion/captions @remotion/google-fonts

      # 6. Siapkan browser Remotion
      - name: Prepare Remotion Browser
        run: npx remotion browser ensure

      # 7. Temukan Composition ID
      - name: List Remotion Compositions
        shell: bash
        run: |
          echo "=== AVAILABLE COMPOSITIONS ==="
          npx remotion compositions src/index.ts

      # 8. Render video
      - name: Render Video
        shell: bash
        env:
          COMPOSITION_ID: ${{ github.event.inputs.composition_id || 'Video' }}
        run: |
          mkdir -p out

          echo "=== SELECTED COMPOSITION ==="
          echo "$COMPOSITION_ID"

          echo "=== STARTING RENDER ==="

          npx remotion render \
            src/index.ts \
            "$COMPOSITION_ID" \
            out/remotion-video.mp4 \
            --codec=h264 \
            --concurrency=1

      # 9. Periksa hasil render
      - name: Verify Rendered Video
        shell: bash
        run: |
          echo "=== CHECK OUTPUT ==="

          if [ ! -f out/remotion-video.mp4 ]; then
            echo "ERROR: MP4 was not created"
            exit 1
          fi

          ls -lh out/remotion-video.mp4

          npx remotion ffprobe out/remotion-video.mp4

      # 10. Upload MP4
      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/remotion-video.mp4
          if-no-files-found: error
          retention-days: 7
