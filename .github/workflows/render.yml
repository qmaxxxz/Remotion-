
name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion Composition ID"
        required: true
        default: "Video"
        type: string

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Check project files
      - name: Diagnose Project
        shell: bash
        run: |
          echo "=== PROJECT LOCATION ==="
          pwd

          echo "=== PACKAGE JSON ==="
          cat package.json

          echo "=== PROJECT ENTRY FILES ==="
          find . -maxdepth 4 -type f \
            \( -name "index.ts" -o -name "index.tsx" \
            -o -name "index.js" -o -name "Root.tsx" \) \
            ! -path './node_modules/*'

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 5. Verify dependencies
      - name: Check Remotion Dependencies
        run: |
          npm ls remotion @remotion/cli \
            @remotion/captions @remotion/google-fonts

      # 6. Install Remotion browser
      - name: Prepare Remotion Browser
        run: npx remotion browser ensure

      # 7. List compositions
      - name: List Remotion Compositions
        run: |
          npx remotion compositions src/index.ts

      # 8. Render MP4
      - name: Render Video
        shell: bash
        env:
          COMPOSITION_ID: ${{ github.event.inputs.composition_id || 'Video' }}
        run: |
          mkdir -p out

          echo "=== COMPOSITION ID ==="
          echo "$COMPOSITION_ID"

          npx remotion render \
            src/index.ts \
            "$COMPOSITION_ID" \
            out/remotion-video.mp4 \
            --codec=h264 \
            --concurrency=1

      # 9. Verify output
      - name: Verify Rendered Video
        shell: bash
        run: |
          if [ ! -s out/remotion-video.mp4 ]; then
            echo "ERROR: MP4 not found or empty"
            exit 1
          fi

          echo "=== RENDER SUCCESS ==="
          ls -lh out/remotion-video.mp4

      # 10. Upload artifact
      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/remotion-video.mp4
          if-no-files-found: error
          retention-days: 7
