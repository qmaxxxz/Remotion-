
name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion Composition ID"
        required: true
        default: "Video"

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prepare Remotion Browser
        run: npx remotion browser ensure
        
      - name: Diagnose Remotion Project
        run: |
          echo "=== PROJECT LOCATION ==="
          pwd

          echo "=== PROJECT FILES ==="
          find . -maxdepth 4 -type f \
            ! -path './node_modules/*' \
            ! -path './.git/*' | sort | head -200

          echo "=== PACKAGE JSON ==="
          cat package.json

          echo "=== REMOTION ENTRY FILES ==="
          find . -maxdepth 4 -type f \
            \( -name "index.ts" -o -name "index.tsx" -o -name "Root.tsx" \) \
            ! -path './node_modules/*'
            
      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/remotion-video.mp4
          if-no-files-found: error
          retention-days: 7
